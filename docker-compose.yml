services:
  frontend:
    build:
      context: frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${APP_PORT:-5555}:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules # Evita conflito com node_modules local (container-only)
    environment:
      - CHOKIDAR_USEPOLLING=true # Necessário em ambientes como Windows/WSL2
      - VITE_ALLOWED_HOST=${VITE_ALLOWED_HOST}
    depends_on:
      - node
    networks:
      - rede

  node:
    build:
      context: backend
      dockerfile: Dockerfile
    restart: unless-stopped
    volumes:
      - ./backend:/usr/src/app
      - ./backend/data:/usr/src/app/data
      - /usr/src/app/node_modules
    environment:
      - NODE_ENV=development
    networks:
      - rede

  database:
    image: postgres:18-alpine
    restart: unless-stopped
    volumes:
      - db_data:/var/lib/postgresql
      - ./backend/init.sql:/docker-entrypoint-initdb.d/init.sql
    environment:
      - POSTGRES_USER=usuario
      - POSTGRES_PASSWORD=senha
      - POSTGRES_DB=bancodados
      - TZ=America/Sao_Paulo
      - PGTZ=America/Sao_Paulo
    networks:
      - rede

networks:
  rede:
volumes:
  db_data:
